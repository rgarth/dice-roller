<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dice roller" />
    <title>Dice roller</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css?v=neutral-tray" />
    <script>
      window.DICE_ANALYTICS_ID = "G-B8NZH9W0ZK";
      (function () {
        var id = window.DICE_ANALYTICS_ID;
        if (!/^G-[A-Z0-9]+$/.test(id)) {
          return;
        }
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id);
        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="table" aria-hidden="true"></div>

    <aside class="tray" aria-label="Dice tray">
      <p class="tray-label">Tray</p>
      <div id="dice-picker" class="picker"></div>
      <p class="cap" id="cap">0/10</p>
      <div>
        <button id="color-toggle" type="button" title="Choose dice color">
          <span id="color-dot" class="color-dot"></span>
        </button>
      </div>
      <button id="roll-btn" type="button" disabled>Roll</button>
      <button id="clear-btn" type="button" disabled>Clear</button>
    </aside>

    <div id="color-panel" class="color-panel" hidden>
      <div class="color-panel-head">
        <p>Dice color</p>
        <button id="color-close" type="button" title="Close">×</button>
      </div>
      <div id="color-swatches" class="color-swatches"></div>
      <label class="marble-toggle">
        <input id="marble-toggle" type="checkbox" />
        Marble
      </label>
    </div>

    <section class="result" id="result" hidden>
      <p class="notation" id="notation"></p>
      <p class="breakdown" id="breakdown"></p>
      <p class="total" id="total"></p>
    </section>

    <p class="status" id="status" hidden></p>

    <script type="module" src="boot.js?v=analytics"></script>
  </body>
</html>
