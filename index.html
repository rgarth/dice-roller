<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dice roller" />
    <title>Dice roller</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css?v=menu3" />
  </head>
  <body>
    <div id="table" aria-hidden="true"></div>

    <aside class="tray" aria-label="Dice tray">
      <p class="tray-label">Tray</p>
      <div id="dice-picker" class="picker"></div>
      <p class="cap" id="cap">0/10</p>
      <div>
        <button id="color-toggle" type="button" title="Options" aria-expanded="false" aria-controls="color-panel">
          <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
      <button id="roll-btn" type="button" disabled>Roll</button>
      <button id="clear-btn" type="button" disabled>Clear</button>
    </aside>

    <div id="color-panel" class="color-panel" hidden>
      <div class="color-panel-head">
        <p>Options</p>
        <button id="color-close" type="button" title="Close">×</button>
      </div>
      <div id="color-swatches" class="color-swatches"></div>
      <label class="marble-toggle">
        <input id="marble-toggle" type="checkbox" />
        Marble
      </label>
      <div class="hundred-choice">
        <span class="hundred-label">D100</span>
        <label>
          <input id="hundred-die" type="radio" name="hundred" value="die" checked />
          1xd100
        </label>
        <label>
          <input id="hundred-pair" type="radio" name="hundred" value="pair" />
          2xd10
        </label>
      </div>
    </div>

    <section class="result" id="result" hidden>
      <p class="notation" id="notation"></p>
      <p class="breakdown" id="breakdown"></p>
      <p class="total" id="total"></p>
    </section>

    <p class="status" id="status" hidden></p>

    <script type="module" src="boot.js?v=menu5"></script>
  </body>
</html>
