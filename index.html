<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dice roller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=fit-width" />
  </head>
  <body>
    <div id="table" aria-hidden="true"></div>

    <aside class="tray" aria-label="Dice tray">
      <p class="tray-label">Tray</p>
      <div id="dice-picker" class="picker"></div>
      <p class="cap" id="cap">0/10</p>
      <div class="color-picker">
        <button id="color-toggle" type="button" title="Choose dice color">
          <span id="color-dot" class="color-dot"></span>
        </button>
      </div>
      <button id="roll-btn" type="button" disabled>Roll</button>
      <button id="clear-btn" type="button" disabled>Clear</button>
    </aside>

    <div id="color-panel" class="color-panel" hidden>
      <div class="color-panel-head">
        <p>Dice color</p>
        <button id="color-close" type="button" title="Close">×</button>
      </div>
      <div id="color-swatches" class="color-swatches"></div>
      <label class="marble-toggle">
        <input id="marble-toggle" type="checkbox" />
        Marble
      </label>
    </div>

    <section class="result" id="result" hidden>
      <p class="notation" id="notation"></p>
      <p class="breakdown" id="breakdown"></p>
      <p class="total" id="total"></p>
    </section>

    <p class="status" id="status" hidden></p>

    <script src="vendor/three.min.js"></script>
    <script src="vendor/cannon.min.js"></script>
    <script src="vendor/dice.js?v=fit-width2"></script>
    <script src="app.js?v=marble-toggle"></script>
  </body>
</html>
