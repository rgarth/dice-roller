<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1611" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dice roller" />
    <title>Dice roller</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css?v=mod5" />
    <script>
      window.DICE_ANALYTICS_ID = "G-B8NZH9W0ZK";
      (function () {
        var id = window.DICE_ANALYTICS_ID;
        if (!/^G-[A-Z0-9]+$/.test(id)) {
          return;
        }
        window.dataLayer = window.dataLayer || [];
        function gtag() {
          window.dataLayer.push(arguments);
        }
        window.gtag = gtag;
        gtag("js", new Date());
        gtag("config", id);
        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="table" aria-hidden="true"></div>

    <aside class="tray" aria-label="Dice tray">
      <div id="dice-picker" class="picker">
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d4">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D4</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d6">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D6</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d8">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D8</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d10">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D10</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d12">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D12</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d20">
            <span class="die-face" style="background-color: #393939; color: #c4a15a">D20</span>
          </button>
        </div>
        <div class="die-wrap">
          <button class="die-btn" type="button" title="Add d100">
            <span class="die-face is-wide" style="background-color: #393939; color: #c4a15a">D100</span>
          </button>
        </div>
      </div>
      <p class="cap" id="cap">0/10</p>
      <div>
        <button id="color-toggle" type="button" title="Options" aria-expanded="false" aria-controls="color-panel">
          <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
      </div>
      <button id="roll-btn" type="button" disabled>Roll</button>
      <button id="clear-btn" type="button" disabled>Clear</button>
      <div class="modifier">
        <p class="modifier-label">Mod</p>
        <button id="modifier-toggle" type="button" title="Modifier" aria-expanded="false" aria-controls="modifier-panel">0</button>
      </div>
    </aside>

    <div id="modifier-panel" class="modifier-panel" hidden>
      <div class="color-panel-head">
        <p>Modifier</p>
        <button id="modifier-close" type="button" title="Close">×</button>
      </div>
      <div class="modifier-controls">
        <button id="modifier-minus" type="button" title="Decrease modifier" aria-label="Decrease modifier">−</button>
        <input id="modifier-value" type="text" inputmode="text" value="0" aria-label="Modifier" autocomplete="off" spellcheck="false" />
        <button id="modifier-plus" type="button" title="Increase modifier" aria-label="Increase modifier">+</button>
      </div>
      <button id="modifier-reset" type="button">Reset</button>
    </div>

    <div id="color-panel" class="color-panel" hidden>
      <div class="color-panel-head">
        <p>Options</p>
        <button id="color-close" type="button" title="Close">×</button>
      </div>
      <div id="color-swatches" class="color-swatches"></div>
      <label class="marble-toggle">
        <input id="marble-toggle" type="checkbox" />
        Marble
      </label>
      <div class="hundred-choice">
        <span class="hundred-label">D100</span>
        <label>
          <input id="hundred-die" type="radio" name="hundred" value="die" checked />
          1xd100
        </label>
        <label>
          <input id="hundred-pair" type="radio" name="hundred" value="pair" />
          2xd10
        </label>
      </div>
    </div>

    <section class="result" id="result" hidden>
      <p class="notation" id="notation"></p>
      <p class="breakdown" id="breakdown"></p>
      <p class="total" id="total"></p>
    </section>

    <p class="status" id="status" hidden></p>

    <script defer src="app.js?v=mod6"></script>
    <script type="module" src="boot.js?v=weight1"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js");
      }
    </script>
  </body>
</html>
